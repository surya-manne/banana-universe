# Unified PR gate — replaces standalone benchmarks.yml for PR validation.
# benchmarks.yml remains active for push-to-main scheduled/manual benchmark runs.

name: CI

on:
  pull_request:
    branches:
      - benchmark
  push:
    branches:
      - benchmark

jobs:
  type-check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check — packages/bananajs
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/bananajs

      - name: Type check — packages/bananajs-cli
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/bananajs-cli

      - name: Type check — packages/ddd
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/ddd

      - name: Type check — packages/plugin-typeorm
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/plugin-typeorm

      - name: Type check — packages/plugin-mongoose
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/plugin-mongoose

      - name: Type check — packages/plugin-otel
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/plugin-otel

      - name: Type check — packages/plugin-websocket
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/plugin-websocket

      - name: Type check — packages/adapter-fastify
        run: npx tsc -p tsconfig.lib.json --noEmit
        working-directory: packages/adapter-fastify

      - name: Type check — apps/example-rest-postgresql
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-rest-postgresql

      - name: Type check — apps/example-multitenant
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-multitenant

      - name: Type check — apps/example-websocket-chat
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-websocket-chat

      - name: Type check — apps/example-rest-mongodb
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-rest-mongodb

      - name: Type check — apps/example-rest-dual-orm
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-rest-dual-orm

      - name: Integration smoke — apps/example-rest-dual-orm
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_dual_orm
        run: npm test
        working-directory: apps/example-rest-dual-orm

      - name: Type check — apps/example-fastify
        run: npx tsc -p tsconfig.app.json --noEmit
        working-directory: apps/example-fastify

      - name: Build check — bananajs
        run: npx nx build bananajs

  benchmarks:
    name: Benchmark Regression Gate
    runs-on: ubuntu-latest
    needs: type-check
    if: |
      contains(github.event.head_commit.modified, 'packages/bananajs/') ||
      contains(github.event.head_commit.modified, 'apps/benchmarks/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build bananajs
        run: npx tsc -p packages/bananajs/tsconfig.lib.json

      - name: Run benchmarks
        working-directory: apps/benchmarks
        run: node --loader ts-node/esm src/benchmark.ts

      - name: Compare to baseline
        working-directory: apps/benchmarks
        run: node --loader ts-node/esm src/report.ts

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: apps/benchmarks/results.json
          retention-days: 30
