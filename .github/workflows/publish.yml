name: Publish

on:
  push:
    tags:
      - 'v*' # triggers on v0.4.0, v0.5.0, etc.

# Explicit publish ordering: bananajs → @banana-universe/ddd → plugin-* → bananajs-cli
#
# TODO Phase 6+: Switch to Nx affected for selective publish:
#   npx nx affected --target=publish --base=last-tag
# This avoids re-publishing unchanged packages on every tag.
# CLI and DDD package versions are independent of core bananajs version.

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # 1. Core framework — must publish first; all other packages may peer-depend on it
      - name: Build & publish bananajs
        run: npx nx build bananajs && cd packages/bananajs && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. DDD primitives — peer of plugins + CLI-generated apps
      - name: Build & publish ddd
        run: npx nx build ddd && cd packages/ddd && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 3. ORM plugins — depend on bananajs + ddd peers
      - name: Build & publish plugin-typeorm
        run: npx nx build plugin-typeorm && cd packages/plugin-typeorm && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish plugin-prisma
        run: npx nx build plugin-prisma && cd packages/plugin-prisma && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 4. Observability & utility plugins
      - name: Build & publish plugin-otel
        run: npx nx build plugin-otel && cd packages/plugin-otel && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish plugin-zod
        run: npx nx build plugin-zod && cd packages/plugin-zod && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish plugin-websocket
        run: npx nx build plugin-websocket && cd packages/plugin-websocket && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish adapter-fastify
        run: npx nx build adapter-fastify && cd packages/adapter-fastify && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 5. CLI — publishes last; may reference versions of all packages above
      - name: Build & publish bananajs-cli
        run: npx nx build bananajs-cli && cd packages/bananajs-cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
