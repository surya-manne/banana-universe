name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'packages/bananajs/src/**' # rebuild API reference when source changes

jobs:
  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for gh-pages deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — required for future version dropdown from git tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install docs-site dependencies
        run: npm ci
        working-directory: docs-site

      - name: Generate TypeDoc API reference
        run: npm run typedoc
        working-directory: docs-site

      - name: Build VitePress site
        run: npx vitepress build
        working-directory: docs-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-site/.vitepress/dist
          publish_branch: gh-pages
          commit_message: 'docs: deploy ${{ github.sha }}'
