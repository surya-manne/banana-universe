<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- Browser chrome -->
  <rect width="1200" height="760" rx="10" fill="#1e2a3a"/>
  <rect x="0" y="0" width="1200" height="44" rx="10" fill="#132a45"/>
  <rect x="0" y="24" width="1200" height="20" fill="#132a45"/>
  <!-- Browser dots -->
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22" r="6" fill="#febc2e"/>
  <circle cx="68" cy="22" r="6" fill="#28c840"/>
  <!-- Address bar -->
  <rect x="120" y="11" width="820" height="22" rx="11" fill="#0a1628"/>
  <text x="530" y="26" text-anchor="middle" fill="#6b7a8d" font-size="12">http://localhost:3000/api-docs</text>

  <!-- Page content area -->
  <rect x="0" y="44" width="1200" height="716" fill="#fafafa"/>

  <!-- Swagger UI header bar -->
  <rect x="0" y="44" width="1200" height="58" fill="#1b1b1b"/>
  <!-- Swagger logo area -->
  <rect x="30" y="57" width="130" height="28" rx="4" fill="#28a745"/>
  <text x="95" y="75" text-anchor="middle" fill="white" font-size="15" font-weight="bold">swagger</text>
  <!-- API title -->
  <text x="200" y="70" fill="white" font-size="18" font-weight="bold">My BananaJS API</text>
  <text x="200" y="87" fill="#aaa" font-size="12">OAS3 · /api-docs.json</text>

  <!-- Info section -->
  <rect x="30" y="118" width="1140" height="80" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="52" y="143" fill="#3b4151" font-size="18" font-weight="bold">My BananaJS API</text>
  <rect x="52" y="150" width="68" height="18" rx="3" fill="#89bf04"/>
  <text x="86" y="163" text-anchor="middle" fill="white" font-size="11" font-weight="bold">OAS 3.0.3</text>
  <text x="132" y="163" fill="#3b4151" font-size="12">1.0.0</text>
  <text x="52" y="185" fill="#6d7a85" font-size="13">Auto-generated OpenAPI spec from BananaJS decorator metadata. No YAML files required.</text>

  <!-- Server section -->
  <rect x="30" y="210" width="1140" height="48" rx="6" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="52" y="232" fill="#3b4151" font-size="13" font-weight="600">Servers</text>
  <rect x="52" y="238" width="300" height="12" rx="3" fill="#f0f0f0"/>
  <text x="52" y="248" fill="#3b4151" font-size="12">http://localhost:3000</text>

  <!-- Users tag section -->
  <rect x="30" y="272" width="1140" height="42" rx="6" fill="#e8f3d6" stroke="#c6e3a0" stroke-width="1"/>
  <rect x="30" y="272" width="6" height="42" rx="3" fill="#61affe"/>
  <text x="52" y="298" fill="#3b4151" font-size="16" font-weight="bold">Users</text>
  <text x="160" y="298" fill="#6d7a85" font-size="12">User management endpoints</text>
  <text x="1120" y="298" fill="#3b4151" font-size="20">▾</text>

  <!-- GET /users endpoint -->
  <rect x="30" y="324" width="1140" height="46" rx="4" fill="#e7f3fb" stroke="#c4dff7" stroke-width="1"/>
  <rect x="42" y="337" width="42" height="20" rx="3" fill="#61affe"/>
  <text x="63" y="351" text-anchor="middle" fill="white" font-size="12" font-weight="bold">GET</text>
  <text x="100" y="351" fill="#3b4151" font-size="14">/users</text>
  <text x="260" y="351" fill="#717171" font-size="13">List all users</text>
  <rect x="1060" y="333" width="92" height="22" rx="11" fill="none" stroke="#61affe" stroke-width="1.5"/>
  <text x="1106" y="348" text-anchor="middle" fill="#61affe" font-size="12">Try it out</text>

  <!-- POST /users endpoint -->
  <rect x="30" y="380" width="1140" height="46" rx="4" fill="#eaf7ec" stroke="#c3e8c9" stroke-width="1"/>
  <rect x="42" y="393" width="42" height="20" rx="3" fill="#49cc90"/>
  <text x="63" y="407" text-anchor="middle" fill="white" font-size="12" font-weight="bold">POST</text>
  <text x="100" y="407" fill="#3b4151" font-size="14">/users</text>
  <text x="260" y="407" fill="#717171" font-size="13">Create a new user</text>
  <rect x="1060" y="389" width="92" height="22" rx="11" fill="none" stroke="#49cc90" stroke-width="1.5"/>
  <text x="1106" y="404" text-anchor="middle" fill="#49cc90" font-size="12">Try it out</text>

  <!-- GET /users/:id endpoint -->
  <rect x="30" y="436" width="1140" height="46" rx="4" fill="#e7f3fb" stroke="#c4dff7" stroke-width="1"/>
  <rect x="42" y="449" width="42" height="20" rx="3" fill="#61affe"/>
  <text x="63" y="463" text-anchor="middle" fill="white" font-size="12" font-weight="bold">GET</text>
  <text x="100" y="463" fill="#3b4151" font-size="14">/users/<tspan fill="#9a6a00">{id}</tspan></text>
  <text x="260" y="463" fill="#717171" font-size="13">Get user by ID</text>
  <rect x="1060" y="445" width="92" height="22" rx="11" fill="none" stroke="#61affe" stroke-width="1.5"/>
  <text x="1106" y="460" text-anchor="middle" fill="#61affe" font-size="12">Try it out</text>

  <!-- PATCH /users/:id endpoint -->
  <rect x="30" y="492" width="1140" height="46" rx="4" fill="#fdf1e0" stroke="#f8d9a8" stroke-width="1"/>
  <rect x="42" y="505" width="52" height="20" rx="3" fill="#fca130"/>
  <text x="68" y="519" text-anchor="middle" fill="white" font-size="12" font-weight="bold">PATCH</text>
  <text x="110" y="519" fill="#3b4151" font-size="14">/users/<tspan fill="#9a6a00">{id}</tspan></text>
  <text x="260" y="519" fill="#717171" font-size="13">Update user</text>
  <rect x="1060" y="501" width="92" height="22" rx="11" fill="none" stroke="#fca130" stroke-width="1.5"/>
  <text x="1106" y="516" text-anchor="middle" fill="#fca130" font-size="12">Try it out</text>

  <!-- DELETE /users/:id endpoint -->
  <rect x="30" y="548" width="1140" height="46" rx="4" fill="#fce8e8" stroke="#f5c6c7" stroke-width="1"/>
  <rect x="42" y="561" width="58" height="20" rx="3" fill="#f93e3e"/>
  <text x="71" y="575" text-anchor="middle" fill="white" font-size="12" font-weight="bold">DELETE</text>
  <text x="116" y="575" fill="#3b4151" font-size="14">/users/<tspan fill="#9a6a00">{id}</tspan></text>
  <text x="260" y="575" fill="#717171" font-size="13">Delete user</text>
  <rect x="1060" y="557" width="92" height="22" rx="11" fill="none" stroke="#f93e3e" stroke-width="1.5"/>
  <text x="1106" y="572" text-anchor="middle" fill="#f93e3e" font-size="12">Try it out</text>

  <!-- Articles tag section (collapsed) -->
  <rect x="30" y="608" width="1140" height="42" rx="6" fill="#f0f0f0" stroke="#d8d8d8" stroke-width="1"/>
  <rect x="30" y="608" width="6" height="42" rx="3" fill="#49cc90"/>
  <text x="52" y="634" fill="#3b4151" font-size="16" font-weight="bold">Articles</text>
  <text x="170" y="634" fill="#6d7a85" font-size="12">Article management endpoints</text>
  <text x="1120" y="634" fill="#6d7a85" font-size="20">▸</text>

  <!-- Auth section (collapsed with lock) -->
  <rect x="30" y="660" width="1140" height="42" rx="6" fill="#f0f0f0" stroke="#d8d8d8" stroke-width="1"/>
  <rect x="30" y="660" width="6" height="42" rx="3" fill="#fca130"/>
  <text x="52" y="686" fill="#3b4151" font-size="16" font-weight="bold">Auth</text>
  <text x="120" y="686" fill="#6d7a85" font-size="12">Authentication endpoints</text>
  <!-- Lock icon hint -->
  <rect x="1080" y="668" width="62" height="22" rx="3" fill="none" stroke="#b5b5b5" stroke-width="1"/>
  <text x="1111" y="683" text-anchor="middle" fill="#595959" font-size="11">🔒 JWT</text>
  <text x="1120" y="686" fill="#6d7a85" font-size="20">▸</text>

  <!-- Schemas bar at bottom -->
  <rect x="30" y="712" width="1140" height="36" rx="6" fill="#f0f0f0" stroke="#d8d8d8" stroke-width="1"/>
  <text x="52" y="735" fill="#3b4151" font-size="14" font-weight="bold">Schemas</text>
  <text x="1120" y="735" fill="#6d7a85" font-size="20">▸</text>
</svg>
